name: "Label Actions"

on:
  issues:
    types: [labeled, unlabeled]
  # pull_request_target so the token can comment on and close PRs from forks.
  # Safe here because the workflow never checks out or runs PR code.
  pull_request_target:
    types: [labeled, unlabeled]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: dessant/label-actions@65225c179d3b2502f6eda7b3d15101a3f412366b # v5.0.3