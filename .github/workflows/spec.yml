name: Generate mobile-wallet-adapter specification

on:
  push:
    branches: [ main ]
    paths: [ '.github/**', 'spec/**' ]
  pull_request:
    branches: [ main ]
    paths: [ '.github/**', 'spec/**' ]

defaults:
  run:
    working-directory: spec

jobs:
  generate-spec:
    runs-on: ubuntu-latest

    env:
      BUNDLE_WITHOUT: 'development'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: set up PlantUML
        run: ./setup-plantuml.sh
        working-directory: .github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          working-directory: spec

      - name: Generate jekyll site
        run: bundle exec jekyll build
        working-directory: spec

      # Upload spec jekyll site to workflow artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spec-jekyll-site
          path: spec/_site/*
          if-no-files-found: error
          retention-days: 1

  publish-to-gh-pages:
    runs-on: ubuntu-latest
    needs: generate-spec
    concurrency: publish-to-gh-pages
    if: ${{ github.event_name == 'push' && !github.event.repository.fork }}

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.PR_BOT_APP_ID }}
          private-key: ${{ secrets.PR_BOT_PRIVATE_KEY }}

      - name: Checkout gh-pages branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          token: ${{ steps.app-token.outputs.token }}

      - name: Refresh spec directory
        working-directory: ${{ github.workspace }}
        run: rm -rf spec

      - name: Download spec jekyll site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: spec-jekyll-site
          path: spec

      - name: Commit and push to gh-pages
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Update spec jekyll site"
            git push origin gh-pages
          fi
