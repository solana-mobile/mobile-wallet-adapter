name: Generate mobile-wallet-adapter specification

on:
  push:
    branches: [ main ]
    paths: [ '.github/**', 'spec/**' ]
  pull_request:
    branches: [ main ]
    paths: [ '.github/**', 'spec/**' ]

defaults:
  run:
    working-directory: spec

jobs:
  generate-spec:
    runs-on: ubuntu-latest

    env:
      BUNDLE_WITHOUT: 'development'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: set up PlantUML
        run: ./setup-plantuml.sh
        working-directory: .github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          working-directory: spec

      - name: Generate jekyll site
        run: bundle exec jekyll build
        working-directory: spec

      # Upload spec jekyll site to workflow artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spec-jekyll-site
          path: spec/_site/*
          if-no-files-found: error
          retention-days: 1

  publish-to-gh-pages:
    runs-on: ubuntu-latest
    needs: generate-spec
    concurrency: publish-to-gh-pages
    if: ${{ github.event_name == 'push' && !github.event.repository.fork }}

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.PR_BOT_APP_ID }}
          private-key: ${{ secrets.PR_BOT_PRIVATE_KEY }}

      - name: Checkout gh-pages branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          token: ${{ steps.app-token.outputs.token }}

      - name: Refresh spec directory
        working-directory: ${{ github.workspace }}
        run: rm -rf spec

      - name: Download spec jekyll site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: spec-jekyll-site
          path: spec

      - name: Commit and push to gh-pages
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Update spec jekyll site"
            git push origin gh-pages
          fi
